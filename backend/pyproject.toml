[project]
name = "omnipharma-backend"
version = "1.0.0"
description = "OmniPharma — Agentic pharmacist/clinical decision-support backend"
readme = "README.md"
authors = [
    { name = "OmbongiFelix", email = "fombongi11@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.141.1",
    "hatchling>=1.32.4",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.0.0",
    "sqlalchemy>=2.1.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
